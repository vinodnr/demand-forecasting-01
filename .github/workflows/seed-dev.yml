name: Seed Dev Data (dev branch)
# WARNING: This workflow is intended to run on a self-hosted runner that has Docker & docker-compose installed.
# Running on GitHub-hosted runners may not be appropriate for long-lived docker-compose stacks and can expose secrets.
on:
  push:
    branches: ['dev']

jobs:
  seed-dev:
    name: Seed dev data on self-hosted runner
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker is available (runner must provide Docker)
        run: docker --version

      - name: Start dev stack (docker compose)
        run: |
          docker compose -f backend/monitoring/docker-compose.dev.yml up -d --build
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Wait for Postgres to be ready
        run: |
          set -e
          until docker compose -f backend/monitoring/docker-compose.dev.yml exec -T postgres pg_isready -U postgres; do
            echo "waiting for postgres..."
            sleep 2
          done
        timeout-minutes: 10

      - name: Seed users and orgs
        run: |
          docker compose -f backend/monitoring/docker-compose.dev.yml exec -T backend             python backend/scripts/seed_test_users.py
          docker compose -f backend/monitoring/docker-compose.dev.yml exec -T backend             python backend/scripts/seed_orgs_and_users.py

      - name: Verify seeded data
        run: |
          docker compose -f backend/monitoring/docker-compose.dev.yml exec -T postgres psql -U postgres -d demand_forecast -c "SELECT email, role FROM users ORDER BY email LIMIT 10;"
