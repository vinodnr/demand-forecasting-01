name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run unit tests
        run: |
          cd frontend
          npm test -- --coverage

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: driver_manager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: --health-cmd 'curl --fail http://localhost:9000/minio/health/live || exit 1' --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Start backend (dev compose)
        run: |
          docker-compose -f backend/monitoring/docker-compose.dev.yml up -d --build
      - name: Wait for services
        run: |
          sleep 10
      - name: Install Playwright and run E2E
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps
          npx playwright test --config=playwright.config.js
          # Accessibility scan with axe-playwright
          - name: Run accessibility scan (axe-playwright)
            run: |
              cd e2e
              npm ci
              node axe-test.js
            env:
              URL: 'http://localhost:3000/trust'

