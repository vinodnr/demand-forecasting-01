version: '3.8'
services:

backend:
    build:
      context: ..
      dockerfile: Dockerfile.dev
volumes:
  grafana-storage:



backend:
  build:
    context: ..  # build from backend/ (relative to backend/monitoring)
    dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    args:
      - BACKEND_ENV=${BACKEND_ENV:-development}
  environment:
    - DATABASE_URL=${DATABASE_URL}
    - REDIS_URL=redis://redis:6379/0
    - LLM_MANAGER_CACHE_TTL_SECONDS=30
  ports:
    - "8000:8000"
  depends_on:
    - redis
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:8000/metrics || curl -f http://localhost:8000/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
  networks:
    - monitoring
