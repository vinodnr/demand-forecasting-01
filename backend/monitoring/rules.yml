groups:
  - name: demand_forecasting_recording_rules
    rules:
      - record: job:http_requests:rate1m
        expr: sum by (job) (rate(http_requests_total[1m]))
      - record: job:request_latency_p95:histogram
        expr: histogram_quantile(0.95, sum(rate(http_request_latency_seconds_bucket[5m])) by (le))
      - record: job:llm_tokens_rate:1h
        expr: sum(rate(llm_tokens_used_total[1h]))

  - name: demand_forecasting_alerts
    rules:
      - alert: HighErrorRate
        expr: increase(http_requests_total{http_status=~"5.."}[5m]) > 5
        for: 2m
        labels: { severity: "critical" }
        annotations:
          summary: "High 5xx rate"

      - alert: HighLLMUsage
        expr: increase(llm_tokens_used_total[1h]) > 1000000
        for: 10m
        labels: { severity: "warning" }
        annotations:
          summary: "High LLM token usage"


- name: demand_forecasting_slo_rules
  rules:
    # Availability: successful requests (2xx) / total requests over 30d
    - record: slo:availability_30d
      expr: (sum(rate(http_requests_total{http_status=~"2.."}[30d])) / sum(rate(http_requests_total[30d]))) or vector(0)
    # Latency objective: p95 less than 0.5s over 7d (recording rule)
    - record: slo:latency_p95_7d
      expr: histogram_quantile(0.95, sum(rate(http_request_latency_seconds_bucket[7d])) by (le))

